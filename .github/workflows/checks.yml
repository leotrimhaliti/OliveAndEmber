name: Application checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: food_ordering_test
          MYSQL_ROOT_PASSWORD: test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: food_ordering_test
          DB_USERNAME: root
          DB_PASSWORD: test-password
      - run: vendor/bin/pint --test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build
        env:
          VITE_PUBLIC_URL: https://order.example.test
          VITE_INDEXING_ENABLED: 'true'
      - run: npm run check:seo
        env:
          VITE_PUBLIC_URL: https://order.example.test
          VITE_INDEXING_ENABLED: 'true'
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh -n deploy/app-entrypoint.sh deploy/release.sh
      - run: docker build --tag olive-and-ember-app:ci --file deploy/Dockerfile.app .
      - run: docker build --tag olive-and-ember-web:ci --file deploy/Dockerfile.web .
      - run: docker run --rm --entrypoint php olive-and-ember-app:ci artisan --version
      - run: docker run --rm --add-host app:127.0.0.1 olive-and-ember-web:ci nginx -t
